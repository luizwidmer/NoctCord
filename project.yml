{
  "name": "NoctCord",
  "options": {
    "minimumXcodeGenVersion": "2.46.0",
    "deploymentTarget": {
      "macOS": "14.0"
    }
  },
  "settings": {
    "base": {
      "DEVELOPMENT_TEAM": "9MY7SXN56X",
      "CODE_SIGN_STYLE": "Automatic",
      "SWIFT_VERSION": "6.0",
      "MACOSX_DEPLOYMENT_TARGET": "14.0",
      "CURRENT_PROJECT_VERSION": "5",
      "MARKETING_VERSION": "0.1.0",
      "DEBUG_INFORMATION_FORMAT": "dwarf-with-dsym",
      "ENABLE_HARDENED_RUNTIME": "YES",
      "ENABLE_APP_SANDBOX": "YES",
      "ENABLE_USER_SCRIPT_SANDBOXING": "YES",
      "ARCHS": "arm64"
    }
  },
  "packages": {
    "NoctCordLocal": {
      "path": "."
    }
  },
  "targets": {
    "NoctCordApp": {
      "type": "application",
      "platform": "macOS",
      "sources": [
        {
          "path": "Sources/NoctCordApp"
        },
        {
          "path": "Resources/NoctCordIcon.icns",
          "buildPhase": "resources"
        },
        {
          "path": "Resources/PrivacyInfo.xcprivacy",
          "buildPhase": "resources"
        }
      ],
      "settings": {
        "base": {
          "PRODUCT_NAME": "Noct Cord",
          "EXECUTABLE_NAME": "NoctCordApp",
          "PRODUCT_BUNDLE_IDENTIFIER": "org.noctweave.noctcord",
          "INFOPLIST_FILE": "Resources/NoctCordApp-Info.plist",
          "GENERATE_INFOPLIST_FILE": "NO",
          "CODE_SIGN_ENTITLEMENTS": "Resources/NoctCordApp.entitlements"
        }
      },
      "dependencies": [
        {
          "package": "NoctCordLocal",
          "product": "NoctCordUI"
        }
      ]
    }
  },
  "schemes": {
    "NoctCord": {
      "build": {
        "targets": {
          "NoctCordApp": "all"
        }
      },
      "run": {
        "config": "Debug",
        "storeKitConfiguration": "SupportTips.storekit"
      },
      "archive": {
        "config": "Release",
        "postActions": [
          {
            "name": "Attach matching WebRTC debug symbols",
            "settingsTarget": "NoctCordApp",
            "script": "/usr/bin/python3 \"${SRCROOT}/Scripts/prepare-app-store-symbols.py\" --archive \"${ARCHIVE_PATH}\""
          }
        ]
      }
    }
  }
}
